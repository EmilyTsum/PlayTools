name: PTMC build
on:
  push:
    branches: [metal-capture]
    tags: ['ptmc-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tests/ptmc_static.sh
      - run: python3 tests/ptmc_scheduler_model.py
      - run: tests/ptmc_patch_roundtrip.sh
  mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version
      - name: Compile PTMC Metal kernel
        run: |
          python3 tests/extract_ptmc_shader.py > /tmp/PTMCShader.metal
          xcrun -sdk iphoneos metal -c /tmp/PTMCShader.metal -o /tmp/PTMCShader.air
      - name: Build
        run: PTMC_VERSION=0.1.0 scripts/ptmc_build_on_mac.sh
      - name: Validate
        run: |
          file dist/PlayTools.framework/PlayTools
          xcrun vtool -show-build dist/PlayTools.framework/PlayTools
          otool -L dist/PlayTools.framework/PlayTools
          codesign --verify --deep --strict dist/PlayTools.framework
          ! grep -E 'PTMetalCapture\.inc:[0-9]+:[0-9]+: warning:' .ptmc-build/xcodebuild-playtools.log
          grep -E 'warning:' .ptmc-build/xcodebuild-playtools.log > dist/COMPILER_WARNINGS.txt || true
      - uses: actions/upload-artifact@v7
        with:
          name: PlayTools-MetalCapture.framework.zip
          path: |
            dist/PlayTools-MetalCapture.framework.zip
            dist/playtools-metal-capture-*.zip
            dist/BUILD_INFO.txt
            dist/COMPILER_WARNINGS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/ptmc-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/PlayTools-MetalCapture.framework.zip \
            dist/playtools-metal-capture-*.zip \
            dist/BUILD_INFO.txt \
            --title "PlayTools Metal Capture ${GITHUB_REF_NAME#ptmc-v}" \
            --notes "Pre-compositor Metal capture build for the PlayTools fork."
